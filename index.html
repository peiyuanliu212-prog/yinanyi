const WELFARE_COPY = "首批福利：改命礼包，限量 200 份。福利码将在群内发布，开放后回游戏输入福利码领取。";
const WELFARE_REWARD_TEXT = "情报 +3 · 精装海报 +3 · 续命一手 +1";

function welfareClaimed() { return !!(store.welfareClaimed || cloudUi.welfareClaimed); }
function welfareBoxHtml() {
  if (welfareClaimed()) {
    return '<div class="no">群 福 利</div><div class="wdone">改命礼包 · 已领取</div>' +
      '<div class="wmsg ok">奖励已存入福利余额（' + WELFARE_REWARD_TEXT + "），用钩子时先扣福利、再扣每日次数。</div>";
  }
  return '<div class="no">群 福 利</div>' +
    '<div class="wmsg" style="margin-top:2px">' + WELFARE_COPY + "</div>" +
    '<div class="wrow"><input id="welfareCode" type="text" placeholder="输入福利码" autocomplete="off" maxlength="24">' +
    '<button class="wbtn" id="welfareBtn">领 取</button></div>' +
    '<div class="wmsg" id="welfareMsg">奖励：' + WELFARE_REWARD_TEXT + "（存入福利余额，先于每日次数使用）</div>";
}
function paintWelfare() {
  const box = document.getElementById("welfareBox");
  if (!box) return;
  box.innerHTML = welfareBoxHtml();
  bindWelfare();
}
function bindWelfare() {
  const btn = document.getElementById("welfareBtn");
  if (!btn) return;
  btn.addEventListener("click", () => {
    const input = document.getElementById("welfareCode");
    const msg = document.getElementById("welfareMsg");
    const code = input ? input.value : "";
    if (!String(code || "").trim()) { if (msg) msg.textContent = "先输入福利码（群内发布）再领取。"; return; }
    btn.disabled = true;
    if (msg) msg.textContent = "核销中…";
    PlatformAdapter.redeemWelfare(code, r => {
      btn.disabled = false;
      if (!r || r.status === "unavailable") { if (msg) msg.textContent = "云端暂不可达，请稍后再试。"; return; }
      if (r.bonus) cloudUi.bonus = r.bonus;
      if (r.status === "ok") {
        store.welfareClaimed = true; cloudUi.welfareClaimed = true; saveStore();
        closeWelfarePopup();
        paintWelfare();
        toast("领取成功：" + WELFARE_REWARD_TEXT + " 已存入福利余额");
        return;
      }
      if (r.status === "already") {
        store.welfareClaimed = true; cloudUi.welfareClaimed = true; saveStore();
        paintWelfare();
        toast("你已经领取过改命礼包了");
        return;
      }
      if (msg) msg.textContent = r.status === "exhausted"
        ? "改命礼包已被领完（" + (r.claimedCount || 200) + " / " + (r.totalCap || 200) + "），下次请早。"
        : "福利码不对，请核对后再试。";
    });
  });
}
/* 公告弹窗：已领取或已勾「不再提醒」永不再弹；未勾则每次进首页弹（云端状态确认后判定） */
function maybeShowWelfarePopup() {
  if (state.screen !== "home") return;
  if (store.welfareClaimed || store.welfareMuted) return;
  if (!cloudUi.welfareChecked) return;
  if (cloudUi.welfareClaimed) return;
  showWelfarePopup();
}
function closeWelfarePopup() {
  const el = document.getElementById("welfarePopup");
  if (el && el.parentNode) el.parentNode.removeChild(el);
}
function showWelfarePopup() {
  closeWelfarePopup();
  const mask = document.createElement("div");
  mask.className = "wfMask";
  mask.id = "welfarePopup";
  mask.innerHTML =
    '<div class="wfCard"><div class="no">拼 将 交 流 群</div><h3>群 福 利 公 告</h3>' +
    '<img src="' + GROUP_QR + '" alt="拼将交流群二维码">' +
    '<div class="wcap">微信扫码进群 · 本码 2026-11-11 到期，过期后等群内新码</div>' +
    '<div class="wtext">' + WELFARE_COPY + "</div>" +
    '<label class="wmute"><input type="checkbox" id="wfMute">下次进入不再提醒</label>' +
    '<div class="wbtns"><button class="btn ghost" id="wfClose">稍 后 再 说</button>' +
    '<button class="btn red" id="wfGo">去 输 福 利 码</button></div></div>';
  document.body.appendChild(mask);
  const finish = go => {
    const mute = document.getElementById("wfMute");
    if (mute && mute.checked) { store.welfareMuted = true; saveStore(); }
    closeWelfarePopup();
    if (go) {
      const input = document.getElementById("welfareCode");
      if (input) { input.scrollIntoView({ block: "center" }); input.focus(); }
    }
  };
  document.getElementById("wfClose").addEventListener("click", () => finish(false));
  document.getElementById("wfGo").addEventListener("click", () => finish(true));
}
/* 云端态刷新：钩子 state（带 bonus）+ 福利领取状态；变化时才重渲首页，避免循环 */
function refreshCloudUi(force) {
  const now = Date.now();
  if (!force && cloudUi.bonus !== null && now - cloudUi.hooksAt < 4000) { maybeShowWelfarePopup(); return; }
  cloudUi.hooksAt = now;
  PlatformAdapter.getHookState(data => {
    if (data && data.bonus) {
      const changed = JSON.stringify(cloudUi.bonus) !== JSON.stringify(data.bonus);
      cloudUi.bonus = data.bonus;
      if (changed && state.screen === "home") renderHome();
    }
  });
  PlatformAdapter.getWelfareMe(data => {
    cloudUi.welfareChecked = true;
    if (data) {
      cloudUi.welfareClaimed = !!data.claimed;
      if (data.bonus) cloudUi.bonus = data.bonus;
      if (data.claimed && !store.welfareClaimed) {
        store.welfareClaimed = true; saveStore(); paintWelfare();
      }
    }
    maybeShowWelfarePopup();
  });
}

function renderBoard() {
  state.screen = "board";
  let h = topBar("总卷") +
    "<h1>改 命 榜</h1>" +
    '<div class="sub">全 站 改 命 分 · 单 轮 最 佳</div>' +
    '<div id="boardBody"><div class="boardCard"><div class="no">改 命 榜</div>' +
    '<div class="wmsg" style="margin-top:8px;font-size:13px;color:rgba(38,34,25,.6)">榜单载入中…</div></div></div>' +
    '<button class="btn ghost" id="boardBack" style="margin-top:18px">归 档 · 回 案 卷 列 表</button>';
  app.innerHTML = h;
  document.getElementById("boardBack").addEventListener("click", renderHome);
  trk("exposure", "改命榜");
  let board = null, me = null, done = 0;
  const finish = () => { if (++done < 2) return; paintBoard(board, me); };
  PlatformAdapter.getBoard(d => { board = d; finish(); });
  PlatformAdapter.getMyRank(d => { me = d; finish(); });
  window.scrollTo(0, 0);
}
function paintBoard(board, me) {
  const el = document.getElementById("boardBody");
  if (!el) return;
  const vm = boardViewModel(board, me, localBestScore(store));
  let h = "";
  if (vm.mode === "local") {
    h += '<div class="boardCard"><div class="no">我 的 名 次</div>' +
      '<div class="wmsg" style="margin-top:8px;font-size:13px;color:rgba(38,34,25,.66)">云端榜单暂不可达，先记在本地档案。</div>' +
      '<div class="myRankBig">' + (vm.localBest !== null ? "本地最佳改命分 <b>" + vm.localBest + "</b>" : "暂无本地成绩 · 打完一轮整轮结算即可上榜") + "</div></div>";
    el.innerHTML = h;
    return;
  }
  h += '<div class="boardCard"><div class="no">我 的 名 次</div>' +
    (vm.me
      ? '<div class="myRankBig">第 <b>' + vm.me.rank + "</b> 名 · 改命分 <b>" + vm.me.score + "</b></div>"
      : '<div class="myRankBig" style="font-size:16px">暂无名次</div><div class="wmsg" style="font-size:12.5px;color:rgba(38,34,25,.6);margin-top:4px">打完一轮整轮结算即可上榜</div>') +
    "</div>";
  h += '<div class="boardCard"><div class="no">全 站 前 ' + vm.rows.length + " 名</div>" +
    (vm.rows.length
      ? vm.rows.map(r =>
          '<div class="boardRow' + (r.rank <= 3 ? " top3" : "") + (r.current ? " me" : "") + '">' +
          '<span class="rk">' + r.rank + '</span><span class="nm">' + esc(r.name) + "</span>" +
          (r.current ? '<span class="meTag">我</span>' : "") +
          '<span class="sc">' + r.score + "</span></div>").join("")
      : '<div class="wmsg" style="font-size:13px;color:rgba(38,34,25,.6);margin-top:6px">暂无上榜记录，来打第一轮。</div>') +
    "</div>";
  el.innerHTML = h;
}

/* ================= 屏幕：出手 ================= */
function renderHand(ep, run) {
  state.screen = "hand";
  const hand = currentHand(ep, run);
  if (!hand) { renderSettlement(ep, run); return; }
  const a = run.affix;
  const actIdx = run.actIdx;
  const actHandNo = run.handIdx - actStartIdx(ep, actIdx);
  let h = topBar(ep.no) + advBar(run);
  h += '<div class="affixBanner" style="margin-top:12px;padding:8px 12px"><div class="al">' + esc(ep.acts[actIdx].label) + "暗流 · " + esc(a.name) + '</div><div class="ad2" style="margin-top:1px">' + esc(a.desc) + "</div></div>";
  h += '<div class="hand"><span class="n">' + esc(ep.acts[actIdx].label) + " · 第" + "一二三四五"[actHandNo] + "手 · " + esc(hand.title) + '</span><span class="d">局势快照：' + esc(hand.snapshot) + "</span></div>";
  if (state.phase === "pick") {
    if (run.mode === "hard") h += '<div class="modeNote">困难：全档概率已下调</div>';
    const intelOn = !!(state.intel && state.intel.run === run && state.intel.handIdx === run.handIdx);
    const intel = intelOn ? handIntel(ep, run) : null;
    h += hand.options.map((opt, i) => {
      const prob = effectiveProb(opt, hand, run);
      return '<div class="opt" data-opt="' + i + '"><div class="r1"><span class="name"><span class="tierTag ' + opt.tier + '">' + tierOf(opt.tier).label + "</span>" + esc(opt.name) + '</span>' +
        '<span class="rate ' + opt.tier + '">' + prob + '%</span></div>' +
        '<div class="eff">成功 优势 ' + (opt.okDelta >= 0 ? "+" : "") + opt.okDelta + " · 失败 " + (opt.failDelta >= 0 ? "+" : "") + opt.failDelta + (run.affix.mods && run.affix.mods.handDeltaScale && run.affix.mods.handDeltaScale[hand.id] ? "（暗流修正后结算）" : "") + "</div>" +
        '<div class="cond">成立条件：<b>' + esc(opt.cond) + "</b></div>" +
        (intel ? '<div class="ev">期望值 <b>' + (intel.evs[i] >= 0 ? "+" : "") + intel.evs[i].toFixed(1) + "</b>" + (i === intel.best ? ' <span class="bestTag">最优解</span>' : "") + "</div>" : "") + "</div>";
    }).join("");
    if (intelOn) {
      h += '<button class="hookBtn" disabled style="margin-top:14px;width:100%">情报已揭示 · 本手期望值与最优解已标出</button>';
    } else {
      h += '<button class="hookBtn" id="intelBtn" style="margin-top:14px;width:100%">情报 · 显示本手期望值与最优解 · ' + hookLeftText("intel") + '</button>';
    }
  } else {
    const e = state.lastEntry;
    h += '<div class="resultBox' + (e.success ? "" : " fail") + '"><div class="rh">' + (e.success ? "这一手，成了" : "这一手，没成") +
      ' <span class="' + (e.delta >= 0 ? "dpos" : "dneg") + '">优势 ' + (e.delta >= 0 ? "+" : "") + e.delta + " → " + e.advAfter + "</span></div>" +
      '<div class="rt">' + esc(e.text) + (e.affixNote ? '<br><span style="color:#b23a26">' + esc(e.affixNote) + "</span>" : "") + "</div></div>" +
      '<button class="btn red" id="nextBtn">' + (run.finished ? "看 结 算" : (run.actIdx === 0 && run.handIdx === actStartIdx(ep, 1) ? "幕 间 · 第 一 幕 小 结" : "下 一 手")) + "</button>";
  }
  app.innerHTML = h;
  if (state.phase === "pick") {
    document.querySelectorAll(".opt").forEach(el => el.addEventListener("click", () => {
      const entry = choose(ep, run, parseInt(el.dataset.opt, 10), Math.random);
      state.lastEntry = entry; state.phase = "result"; renderHand(ep, run);
    }));
    const ib = document.getElementById("intelBtn");
    if (ib) {
      trk("exposure", "出手页-情报入口", { ep: ep.id });
      ib.addEventListener("click", () => {
        if (!canUseHook("intel")) { toast("情报次数已用完（今日与福利都已用尽）"); return; }
        trk("click", "出手页-情报入口", { ep: ep.id });
        PlatformAdapter.showRewardAd("intel", res => {
          if (!res || !res.ok) { toast((res && res.message) || "广告未完成，情报未发放"); return; }
          applyHookConsume("intel", res);
          state.intel = { run: run, handIdx: run.handIdx };
          toast("情报到手：本手期望值已标出，最高的一项已打上「最优解」");
          renderHand(ep, run);
        });
      });
    }
  } else {
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.phase = "pick"; state.lastEntry = null;
      if (run.finished) { renderSettlement(ep, run); return; }
      if (run.actIdx === 0 && run.handIdx === actStartIdx(ep, 1)) {
        advanceAct(ep, run, Math.random);
        renderIntermission(ep, run);
        return;
      }
      renderHand(ep, run);
    });
  }
  window.scrollTo(0, 0);
}

    rewriteScore = delta > 0 ? (parts[0] + 1) + " : " + parts[1] : parts[0] + " : " + (parts[1] + 1);
  }

    '<button class="btn red" id="goBtn2">进 入 第 二 幕</button>';
  app.innerHTML = h;
  document.getElementById("goBtn2").addEventListener("click", () => renderHand(ep, run));
  window.scrollTo(0, 0);

/* 全屏安全距（colorbox-fullscreen-safe-top）：只在主容器 #app 的顶部内边距这一处
   避让（基准 22px ＋ 安全距），全文不得有第二处叠加。
   失效根因与修复：宿主桥常在页面脚本执行之后才就绪，旧版启动一瞬间同步读一次，
   读到 0／无 SDK 后永不补读，安全距在真机全屏下失效（顶部眉题行被灵动岛遮挡）。
   改为有界就绪等待：立即试读一次，未就绪（无 SDK 或值为 0）时每 500ms 重试、
   最多 20 次，首次读到 >0 即应用并停止；20 次重试后桥仍无正值，再用一次性探针
   测 env(safe-area-inset-top) 兜底——桥值优先、env 仅兜底，二者严禁相加，且全程
   只应用一次。异常全吞、降级为不避让，本地无宿主时布局不变，核心流程零依赖。 */
(function applySafeTop() {
  var applied = false;
  function applyOnce(v) {
    if (applied) return;
    applied = true;
    try {
      document.getElementById("app").style.paddingTop = (22 + Math.round(v)) + "px";
    } catch (e) { /* 降级：不避让 */ }
  }
  function probeEnvFallback() {
    try {
      var probe = document.createElement("div");
      probe.style.paddingTop = "env(safe-area-inset-top)";
      probe.style.position = "absolute";
      probe.style.visibility = "hidden";
      document.body.appendChild(probe);
      var v = parseFloat(window.getComputedStyle(probe).paddingTop);
      if (probe.parentNode) probe.parentNode.removeChild(probe);
      if (typeof v === "number" && isFinite(v) && v > 0) applyOnce(v);
    } catch (e) { /* 降级：不避让 */ }
  }
  var retries = 0;
  function attempt() {
    var v = 0;
    try {
      var cb = window.ColorboxAI;
      if (cb && typeof cb.getFullscreenSafeTop === "function") {
        var raw = cb.getFullscreenSafeTop();
        if (typeof raw === "number" && isFinite(raw) && raw > 0) v = raw;
      }
    } catch (e) { /* 桥未就绪或异常：按未就绪处理，继续等待 */ }
    if (v > 0) { applyOnce(v); return; }
    if (retries >= 20) { probeEnvFallback(); return; }
    retries++;
    setTimeout(attempt, 500);
  }
  try { attempt(); } catch (e) { /* 降级：不避让 */ }
})();

        }
      }
      _writeJson(AD_PENDING_KEY, pendAll);
      _writeJson(AD_QUEUE_KEY, queue);
      cb({ settled: settled });
    });
  },
  getHookState: function (cb) {
    cb = cb || function () {};
    _hooksState(data => cb(data || null));
  },

  /* 9) 海报发帖：Canvas → OSS → 编辑器（技能原文状态机，防连点） */
  postPoster: function (cb) {
    cb = cb || function () {};
    if (PlatformAdapter._posterBusy) { cb({ ok: false, stage: "busy", message: "海报生成中" }); return; }
    let data = null;
    try { data = PlatformAdapter.posterProvider ? PlatformAdapter.posterProvider() : null; } catch (e) {}
    if (!data) { cb({ ok: false, stage: "nodata", message: "暂无可分享的结算" }); return; }
    const cbx = _cb();
    if (!cbx || !cbx.oss || typeof cbx.oss.uploadFile !== "function"
        || !cbx.request || !cbx.request.bbs || typeof cbx.request.bbs.openPostEditor !== "function"
        || typeof document === "undefined" || typeof document.createElement !== "function") {
      cb({ ok: false, stage: "unavailable", message: "当前环境不支持发帖" });
      return;
    }
    PlatformAdapter._posterBusy = true;
    const finish = r => { PlatformAdapter._posterBusy = false; cb(r); };
    let canvas = null;
    try { canvas = drawPosterCanvas(data); } catch (e) {}
    if (!canvas || typeof canvas.toBlob !== "function") {
      finish({ ok: false, stage: "render", message: "海报生成失败" });
      return;
    }
    canvas.toBlob(blob => {
      if (!blob) { finish({ ok: false, stage: "render", message: "海报生成失败" }); return; }
      _call(() => cbx.oss.uploadFile({ file: blob, filename: "yinanyi-poster-" + Date.now() + ".png" }))
        .then(up => {
          const url = up && up.downloadUrl;
          let valid = false;
          try { const u = new URL(url); valid = u.protocol === "https:" && !!u.hostname; } catch (e) {}
          if (!valid) { finish({ ok: false, stage: "upload", message: "海报上传失败" }); return; }
          const params = { title: posterTitle(data), content: posterContent(data), imageUrl: url };
          const openEditor = () => _call(() => cbx.request.bbs.openPostEditor(params)).then(r => {
            if (r && r.code === 200) finish({ ok: true, imageUrl: url });
            else finish({ ok: false, stage: "open", imageUrl: url, message: (r && r.message) || "发帖编辑器打开失败" });
          }).catch(() => finish({ ok: false, stage: "open", imageUrl: url, message: "发帖编辑器打开失败" }));
          if (cbx.bbsConfig && typeof cbx.bbsConfig.get === "function") {
            _call(() => cbx.bbsConfig.get()).then(bbs => {
              if (bbs && typeof bbs.bbsTagId === "string" && bbs.bbsTagId.trim() !== "") {
                params.topicId = bbs.bbsTopicId;
                params.tagId = bbs.bbsTagId;
                params.topicName = bbs.bbsTopicName;
                params.tagName = bbs.bbsTagName;
              }
              openEditor();
            }).catch(() => openEditor());
          } else openEditor();
        })
        .catch(() => finish({ ok: false, stage: "upload", message: "海报上传失败" }));
    }, "image/png");
  },
  _posterBusy: false,

  /* 10) 用户信息：平台昵称优先（裁决 C-9 增补）；未登录/失败 cb(null) */
  getUserProfile: function (cb) {
    cb = cb || function () {};
    const cbx = _cb();
    if (!cbx || !cbx.auth || typeof cbx.auth.getUserInfo !== "function") { cb(null); return; }
    _call(() => cbx.auth.getUserInfo()).then(res => {
      if (res && res.code === 200 && res.data && res.data.islogin === 1 && res.data.nickname) {
        cb({
          nickname: res.data.nickname,
          avatar: res.data.avatar || res.data.userHeadUrl || "",
          puid: res.data.puid || null
        });
      } else cb(null);
    }).catch(() => cb(null));
  },

  /* 11) 内容安全检测（R-01，能力保留）：玩家自由文本落盘前过检的平台能力。
     二审整改后显示名改取平台昵称、游戏内已无自由文本输入，本方法暂无调用点，
     保留供后续如恢复自由文本功能时接入。无 SDK 时降级放行（无平台风控可调的环境）；
     SDK 已存在时，401 拦截并提示登录，500/异常/超时拦截本次提交。 */
  checkAudit: function (content, cb) {
    cb = cb || function () {};
    const cbx = _cb();
    if (!cbx || !cbx.security || typeof cbx.security.checkAudit !== "function") {
      cb({ ok: true, passed: true, degraded: true });
      return;
    }
    const audit = _call(() => cbx.security.checkAudit(String(content == null ? "" : content)));
    _raceTimeout(audit, 10000).then(r => {
      if (r.t || r.e) {
        cb({ ok: false, passed: false, error: true, message: "内容安全检测暂时不可用，请稍后再试" });
        return;
      }
      const res = r.v;
      if (res && res.code === 200 && res.data === true) {
        cb({ ok: true, passed: true });
      } else if (res && res.code === 200 && res.data === false) {
        cb({ ok: false, passed: false, blocked: true, code: 200, message: "这个署名未通过内容安全检测，请换一个" });
      } else if (res && res.code === 401) {
        cb({ ok: false, passed: false, loginRequired: true, code: 401, message: "请先登录后再保存署名" });
      } else {
        cb({ ok: false, passed: false, error: true, code: res && res.code,
          message: (res && res.message) || "内容安全检测暂时不可用，请稍后再试" });
      }
    });
  },

  /* 12) 打点：act 只用白名单（click/exposure/videoact），事件走 ext.custom */
  track: function (act, label, custom) {
    if (["click", "exposure", "videoact"].indexOf(act) < 0) return false;
    const cbx = _cb();
    if (!cbx || typeof cbx.track !== "function") return false;
    try {
      cbx.track({ act: act, blk: "BMC001", pos: "T1", ext: { label: label, custom: custom || {} } });
      return true;
    } catch (e) { return false; }
  }
};
// === ADAPTER END ===
</script>
<script>
"use strict";
/* 引导接线（适配器定义后执行）：提供者注入、平台昵称、云存档恢复、广告队列核对。
   全部异步且失败静默——平台不可用时游戏保持本地完整可玩。 */
(function bootPlatform() {
  PlatformAdapter.displayNameProvider = function () { return store.nickname; };
  PlatformAdapter.recordsProvider = function () { return store; };
  PlatformAdapter.posterProvider = function () {
    if (!state.ep || !state.run || !state.settle) return null;
    const ep = state.ep, run = state.run, j = state.settle.j;
    return {
      ep: ep, run: run, j: j,
      rw: rewriteSummary(ep, run, j),
      lines: settlementLines(ep, run),
      nickname: store.nickname,
      gained: state.settle.pv ? state.settle.pv.gained : computeScore(j, run.mode),
      declaration: (state.declaration && ep.declarations[state.declaration])
        ? ep.declarations[state.declaration].text : ""
    };
  };
  window.__yinanyiTrack = function (act, label, custom) {
    return PlatformAdapter.track(act, label, custom);
  };
  /* 首更批：首页每次展示后刷新云端态（福利领取/钩子福利余额/公告弹窗判定） */
  onHomeShown = function () { refreshCloudUi(false); };
  refreshCloudUi(true);
  /* 显示名合规（二审整改）：只认平台登录昵称、其次默认名，旧自设名一律不作数。
     平台资料未回前先按默认名落定，回来后再覆盖；云档恢复后同样重定一遍，
     保证首页/结算/海报/榜单提交四处口径一致。 */
  let platformProfile = null;
  function applyDisplayName() {
    const n = resolveDisplayName(platformProfile);
    if (store.nickname !== n) {
      store.nickname = n;
      saveStore();
      if (state.screen === "home") renderHome();
    }
  }
  applyDisplayName();
  PlatformAdapter.getUserProfile(function (p) {
    platformProfile = p;
    applyDisplayName();
  });
  PlatformAdapter.cloudSaveRestore(function (records, updatedAt) {
    if (!records || !updatedAt) return;
    if (updatedAt > PlatformAdapter.cloudSaveState().lastTs) {
      store = normalizeDaily(Object.assign(emptyRecords(), records), todayStr());
      applyDisplayName();
      saveStore();
      PlatformAdapter.markRestored(updatedAt);
      if (state.screen === "home") renderHome();
    }
  });
  PlatformAdapter.settleAdQueue(function () {});
})();
</script>
