/* ---------- 引擎：纯函数（无 DOM / 无存储依赖） ---------- */
function getEpisode(epId) { return EPISODES.find(e => e.id === epId) || null; }
function tierOf(tierKey) { return TIERS.find(t => t.key === tierKey); }
function tierProb(tierKey, modeKey) {
  const i = TIERS.findIndex(t => t.key === tierKey);
  const j = Math.min(i + MODES[modeKey].probShift, TIERS.length - 1);
  return TIERS[j].prob;
}
/* 含暗流修正后的实际成功率（5–95 钳制） */
function effectiveProb(opt, hand, run) {
  let p = tierProb(opt.tier, run.mode);
  const m = (run.affix && run.affix.mods) || {};
  if (m.probBonus && m.probBonus[opt.tier]) p += m.probBonus[opt.tier];
  if (m.probBonusByHand && m.probBonusByHand[hand.id]) p += m.probBonusByHand[hand.id];
  return Math.max(5, Math.min(95, p));
}
/* 含暗流修正后的实际优势变化，返回 {delta, affixNote} */
function effectiveDelta(opt, hand, run, success) {
  let d = success ? opt.okDelta : opt.failDelta;
  const m = (run.affix && run.affix.mods) || {};
  const notes = [];
  if (success && m.successBonus && m.successBonus[opt.tier]) {
    d += m.successBonus[opt.tier];
    notes.push("暗流「" + run.affix.name + "」额外 " + (m.successBonus[opt.tier] > 0 ? "+" : "") + m.successBonus[opt.tier]);
  }
  if (!success && m.failDeltaBonus && m.failDeltaBonus[opt.tier]) {
    d += m.failDeltaBonus[opt.tier];
    notes.push("暗流「" + run.affix.name + "」修正 " + (m.failDeltaBonus[opt.tier] > 0 ? "+" : "") + m.failDeltaBonus[opt.tier]);
  }
  if (m.handDeltaScale && typeof m.handDeltaScale[hand.id] === "number") {
    const scaled = Math.round(d * m.handDeltaScale[hand.id]);
    if (scaled !== d) notes.push("暗流「" + run.affix.name + "」令本手收益减半：" + d + " → " + scaled);
    d = scaled;
  }
  return { delta: d, affixNote: notes.join("；") };
}
/* 开局：抽暗流（rng 第一次调用决定词缀），建账本 */
function newRun(ep, modeKey, rng) {
  rng = rng || Math.random;
  const affix = AFFIXES[Math.floor(rng() * AFFIXES.length) % AFFIXES.length];
  return { epId: ep.id, mode: modeKey, adv: ep.startAdv, handIdx: 0, affix: affix, log: [], rewound: false, finished: false };
}
function currentHand(ep, run) { return run.handIdx < ep.hands.length ? ep.hands[run.handIdx] : null; }
/* 出一手：掷档 → 记账本（单点写入） → 返回本手记录 */
function choose(ep, run, optIdx, rng) {
  rng = rng || Math.random;
  const hand = currentHand(ep, run);
  if (!hand) throw new Error("no hand left");
  const opt = hand.options[optIdx];
  if (!opt) throw new Error("bad option index");
  const prob = effectiveProb(opt, hand, run);
  const success = rng() * 100 < prob;
  const eff = effectiveDelta(opt, hand, run, success);
  const entry = {
    handIdx: run.handIdx, handId: hand.id, verb: hand.verb, title: hand.title,
    optName: opt.name, tier: opt.tier, prob: prob, success: success,
    delta: eff.delta, advBefore: run.adv, advAfter: run.adv + eff.delta,
    text: success ? opt.okText : opt.failText, actor: opt.actor,
    affixNote: eff.affixNote || ""
  };
  run.adv = entry.advAfter;
  run.log.push(entry);
  run.handIdx += 1;
  if (run.handIdx >= ep.hands.length) run.finished = true;
  return entry;
}
/* 续命：撤回第五手，回到出牌前状态。本局标记 rewound —— 成绩标记「续命完成」，
   不计最佳评级（排行榜完整性红线，见 applyResultToRecords 与 BUILD_NOTES）。 */
function rewindRun(ep, run) {
  if (!run.finished || run.log.length !== ep.hands.length) throw new Error("rewind only at settlement");
  const last = run.log.pop();
  run.adv = last.advBefore;
  run.handIdx = ep.hands.length - 1;
  run.finished = false;
  run.rewound = true;
  return last;
}
/* 判定：三档结局 + 评级，阈值全部来自 MODES 配置 */
function judge(ep, run) {
  const mode = MODES[run.mode];
  const th = mode.threshold;
  const adv = run.adv;
  const tier = adv >= th ? "success" : (adv >= th - 20 ? "honor" : "history");
  const rating = adv >= th + 18 ? "S" : (adv >= th ? "A" : (adv >= th - 20 ? "B" : "C"));
  let key = null;
  for (const e of run.log) if (!key || e.delta > key.delta) key = e;
  return { tier: tier, rating: rating, adv: adv, threshold: th, keyHand: key };
}
/* 改命分：沉淀层累计口径（见 BUILD_NOTES）
   审计修复批 F2（2026-11-05）：计划书 §7 定单局结算分＝max(0,终局优势)×模式系数
   （普通 1／困难 2）＋档位加成。此前 computeScore 无模式入参，困难分与普通同值，
   导向全反。系数独立成常量，不并入 MODES（不动模式阈值/降档等已冻结数值）。 */
const MODE_SCORE_COEF = { normal: 1, hard: 2 };
function computeScore(j, modeKey) {
  const coef = MODE_SCORE_COEF[modeKey] || 1;
  return Math.max(0, j.adv) * coef + (j.tier === "success" ? 20 : (j.tier === "honor" ? 8 : 0));
}
function rankFor(totalScore) {
  let cur = RANKS[0], next = null;
  for (let i = 0; i < RANKS.length; i++) {
    if (totalScore >= RANKS[i].min) { cur = RANKS[i]; next = RANKS[i + 1] || null; }
  }
  return { current: cur, next: next };
}
/* 双历史线「我的改写」栏文本 */
function rewriteSummary(ep, run, j) {
  const k = j.keyHand;
  return {
    ending: ep.rewriteEndings[j.tier],
    turning: k ? ("第" + (k.handIdx + 1) + "手「" + k.optName + "」" + (k.success ? "成功" : "虽败犹荣") + "，优势 " + (k.delta >= 0 ? "+" : "") + k.delta + "，是全场转折点。") : "",
    hero: k ? (k.actor + " —— 本局改写功臣") : ""
  };
}
/* 结算归因：逐手 + 暗流单列一行 */
function settlementLines(ep, run) {
  const lines = run.log.map(e => ({
    head: "第" + (e.handIdx + 1) + "手 · " + e.title + "：" + e.optName,
    body: (e.success ? "成功" : "失败") + "（" + tierOf(e.tier).label + "档 " + e.prob + "%）优势 " + (e.delta >= 0 ? "+" : "") + e.delta + " → " + e.advAfter + "。" + e.text,
    affixNote: e.affixNote || ""
  }));
  if (run.affix) lines.push({ head: "暗流 · " + run.affix.name, body: run.affix.affixLine || run.affix.desc, affixNote: "", isAffix: true });
  return lines;
}
/* ---------- 记录层：纯函数（输入输出均为普通对象，存储由表现层负责） ---------- */
function emptyRecords() {
  return { nickname: "无名改命者", totalScore: 0, episodes: {}, votes: {},
    daily: { date: "", firstDone: false, adHooks: {} } };
}
function normalizeDaily(records, todayStr) {
  if (!records.daily || records.daily.date !== todayStr) {
    records.daily = { date: todayStr, firstDone: false, adHooks: {} };
  }
  if (!records.daily.adHooks) records.daily.adHooks = {};
  return records;
}
/* 结算落账：档案册收集 / 累计分 / 最佳评级 / 每日首改
   红线：run.rewound（续命完成）不计最佳评级与最佳优势，其余沉淀照常。 */
function applyResultToRecords(records, ep, run, j, todayStr) {
  normalizeDaily(records, todayStr);
  const gained = computeScore(j, run.mode);
  const rankBefore = rankFor(records.totalScore).current.name;
  records.totalScore += gained;
  const rankAfter = rankFor(records.totalScore).current.name;
  if (!records.episodes[ep.id]) records.episodes[ep.id] = { plays: 0, bestRating: null, bestAdv: null, archive: {} };
  const rec = records.episodes[ep.id];
  rec.plays += 1;
  let archiveNew = null;
  if (!rec.archive[j.tier]) { rec.archive[j.tier] = { date: todayStr }; archiveNew = j.tier; }
  if (!run.rewound) {
    const order = { S: 4, A: 3, B: 2, C: 1 };
    if (!rec.bestRating || order[j.rating] > order[rec.bestRating]) rec.bestRating = j.rating;
    if (rec.bestAdv === null || j.adv > rec.bestAdv) rec.bestAdv = j.adv;
  }
  let firstRewrite = false;
  if (!records.daily.firstDone) { records.daily.firstDone = true; firstRewrite = true; }
  return { gained: gained, firstRewrite: firstRewrite, archiveNew: archiveNew,
    rankBefore: rankBefore, rankAfter: rankAfter, countsForBest: !run.rewound };
}

function advBar(run) {
  const mode = MODES[run.mode];
  const adv = run.adv, th = mode.threshold;
  const remain = th - adv;
  return '<div class="bar"><div class="lab"><span>当前优势值 <b style="color:#b23a26">' + adv + '</b></span>' +
    '<span>改命线 +' + th + (remain > 0 ? " · 还差 " + remain : " · 已越线") + '</span></div>' +
    '<div class="track"><div class="fill" style="left:0;width:' + advPct(adv) + '%"></div>' +
    '<div class="mark" style="left:' + advPct(th) + '%"><span class="markLab">改命线</span></div></div></div>';
}
/* ---------- 广告钩子本地计数（每日上限来自 AD_HOOKS 配置） ---------- */
function hookUsed(key) { return (store.daily.adHooks && store.daily.adHooks[key]) || 0; }
function canUseHook(key) { return hookUsed(key) < AD_HOOKS[key].dailyLimit; }
function consumeHook(key) {
  normalizeDaily(store, todayStr());
  store.daily.adHooks[key] = hookUsed(key) + 1; saveStore();
}
/* ================= 屏幕：首页 ================= */
function renderHome() {
  state.screen = "home"; state.deluxe = false;
  const rk = rankFor(store.totalScore);
  const rankPct = rk.next ? Math.round((store.totalScore - rk.current.min) / (rk.next.min - rk.current.min) * 100) : 100;
  let h = topBar("总卷") +
    '<h1>意难平：<span class="red">这一局</span>我改了</h1>' +
    '<div class="sub">历 史 名 局 · 由 你 重 审</div>' +
    '<div class="tagline">五手牌改写一场真实名局，每手成败全明示</div>';
  /* 改命者档案 */
  h += '<div class="profile"><div class="no">改命者档案</div>' +
    '<span class="nick">' + esc(store.nickname) + '</span><span class="nickEdit" id="nickEdit">改署名</span>' +
    '<div class="rankline">段位 <b>' + rk.current.name + '</b> · 累计改命分 <b>' + store.totalScore + '</b>' +
    (rk.next ? ' · 距「' + rk.next.name + '」还差 ' + (rk.next.min - store.totalScore) + " 分" : " · 已至绝巅") + '</div>' +
    '<div class="rankTrack"><div class="rankFill" style="width:' + rankPct + '%"></div></div>' +
    '<div id="nickEditor"></div></div>';
  /* 模式 */
  h += '<div class="modeRow">' +
    ["normal", "hard"].map(k => {
      const m = MODES[k];
      return '<div class="mode' + (state.mode === k ? " sel" : "") + '" data-mode="' + k + '"><div class="mn">' + m.label + '</div>' +
        '<div class="md">改命线 +' + m.threshold + (k === "hard" ? " · 概率整体降一档" : " · 标准概率") + "</div></div>";
    }).join("") + "</div>";
  /* 案卷列表 + 结局档案册 */
  h += '<h2 class="sec">案 卷 列 表</h2>';
  for (const ep of EPISODES) {

    const locked = ep.status !== "playable";
    h += '<div class="epCard' + (locked ? " locked" : "") + '" data-ep="' + ep.id + '">' +
      (rec && rec.bestRating ? '<div class="estat">最佳评级 ' + rec.bestRating + "</div>" : (locked ? '<div class="estat">封存</div>' : "")) +
      '<div class="et">' + esc(ep.title) + '</div><div class="em">' + esc(ep.listDesc) + "</div>" +
      (locked && ep.hands && ep.hands.length > 0 ? '<button class="hookBtn" data-hook="earlyEpisode" style="margin-top:10px">看广告抢先翻开此卷 · 每日 ' + AD_HOOKS.earlyEpisode.dailyLimit + " 次</button>" : "") +
      "</div>";
    /* 结局档案册 */
    const tiers = [["success", "改命成功"], ["honor", "虽败犹荣"], ["history", "历史照旧"]];
    h += '<div class="arcEpName">结局档案册 · ' + esc(ep.title) + "</div>" + '<div class="archiveRow">' +
      tiers.map(([tk, tn]) => {
        const got = rec && rec.archive && rec.archive[tk];
        return '<div class="arcSlot' + (got ? " got" : "") + '"><div class="an">' + tn + '</div><div class="ad">' + (got ? got.date + " 达成" : (locked ? "卷未启封" : "尚未达成")) + "</div></div>";
      }).join("") + "</div>";
  }
  h += '<div class="foot">本作是模拟归因，不是真实预测。每一局的概率、阈值与归因全部公开，可自行复算。</div>';
  app.innerHTML = h;
  document.querySelectorAll(".mode").forEach(el => el.addEventListener("click", () => { state.mode = el.dataset.mode; renderHome(); }));
  document.querySelectorAll(".epCard").forEach(el => el.addEventListener("click", ev => {
    const ep = getEpisode(el.dataset.ep);
    if (ep.status !== "playable") { toast("此卷尚未启封"); return; }
    trk("click", "案卷架-期数列表", { ep: ep.id });
    renderIntro(ep);
  }));
  document.querySelectorAll('[data-hook="earlyEpisode"]').forEach(el => el.addEventListener("click", ev => {
    ev.stopPropagation();
    if (!canUseHook("earlyEpisode")) { toast("今日抢先次数已用完"); return; }
    PlatformAdapter.showRewardAd("earlyEpisode", res => {
      if (!res || !res.ok) { toast((res && res.message) || "广告未完成，奖励未发放"); return; }

  const ne = document.getElementById("nickEdit");
  if (ne) ne.addEventListener("click", () => {
    document.getElementById("nickEditor").innerHTML =
      '<input class="nickInput" id="nickInput" maxlength="12" value="' + esc(store.nickname) + '">' +
      '<button class="btn small" id="nickSave">存入档案</button>';
    document.getElementById("nickSave").addEventListener("click", () => {
      const input = document.getElementById("nickInput");
      const saveBtn = document.getElementById("nickSave");
      const candidate = (input && input.value.trim()) || "无名改命者";
      if (saveBtn) saveBtn.disabled = true;
      PlatformAdapter.checkAudit(candidate, result => {
        if (!result || !result.ok) {
          if (saveBtn) saveBtn.disabled = false;
          if (result && result.blocked) toast("这个署名未通过内容安全检测，请换一个");
          else if (result && result.loginRequired) toast("请先登录后再保存署名");
          else toast("内容安全检测暂时不可用，请稍后再试");
          return;
        }
        store.nickname = candidate; saveStore(); PlatformAdapter.cloudSaveMirror(); renderHome(); toast("署名已存档");
      });
    });
  });
  trk("exposure", "案卷架-期数列表");
  window.scrollTo(0, 0);
}
/* ================= 屏幕：开卷 ================= */
function renderIntro(ep) {
  state.screen = "intro"; state.ep = ep;
  let h = topBar(ep.no) +
    '<div class="case"><div class="no">本 期 案 卷</div><div class="t">' + esc(ep.title) + "</div>" +
    '<div class="m">' + ep.tags.map(t => '<span class="tag">' + esc(t) + "</span>").join("") + "</div></div>";
  h += ep.intro.map(p => '<p class="introText">' + esc(p) + "</p>").join("");
  h += '<div class="goal">本局任务：<b>' + esc(ep.goal) + '</b><br><span style="font-size:12px;color:#5c543d">模式：' +
    MODES[state.mode].label + " · 改命线 +" + MODES[state.mode].threshold + " · 开局优势 " + ep.startAdv + " · 开卷后抽取一条「暗流」全程生效</span></div>";
  h += '<button class="btn red" id="startBtn">开 卷 改 命</button>' +
    '<button class="btn ghost" id="backBtn">回案卷列表</button>' +

  app.innerHTML = h;
  document.getElementById("backBtn").addEventListener("click", renderHome);
  document.getElementById("startBtn").addEventListener("click", () => {
    state.run = newRun(ep, state.mode, Math.random);
    state.phase = "pick"; state.lastEntry = null; state.settle = null; state.declaration = null; state.settleExposed = false;
    renderAffix(ep, state.run);
  });
  window.scrollTo(0, 0);
}
/* ================= 屏幕：暗流揭示 ================= */
function renderAffix(ep, run) {
  state.screen = "affix";
  const a = run.affix;
  app.innerHTML = topBar(ep.no) +
    '<h2 class="sec" style="border-top:none;margin-top:10px">开 卷 抽 暗 流</h2>' +
    '<div class="affixBanner"><div class="al">本 局 暗 流 · 全 程 生 效</div><div class="an2">' + esc(a.name) + '</div><div class="ad2">' + esc(a.desc) + "</div></div>" +
    '<p class="introText">暗流不是惩罚也不是恩赐，它是这一局的天气。五手牌怎么打，由你；结算时，它会单独记上一笔。</p>' +
    '<button class="btn red" id="goBtn">进 入 第 一 手</button>';
  document.getElementById("goBtn").addEventListener("click", () => renderHand(ep, run));
  window.scrollTo(0, 0);
}
/* ================= 屏幕：出手 ================= */
function renderHand(ep, run) {
  state.screen = "hand";
  const hand = currentHand(ep, run);
  if (!hand) { renderSettlement(ep, run); return; }
  const a = run.affix;
  let h = topBar(ep.no) + advBar(run);
  h += '<div class="affixBanner" style="margin-top:12px;padding:8px 12px"><div class="al">暗流 · ' + esc(a.name) + '</div><div class="ad2" style="margin-top:1px">' + esc(a.desc) + "</div></div>";
  h += '<div class="hand"><span class="n">第' + "一二三四五"[run.handIdx] + "手 · " + esc(hand.title) + '</span><span class="d">局势快照：' + esc(hand.snapshot) + "</span></div>";
  if (state.phase === "pick") {
    if (run.mode === "hard") h += '<div class="modeNote">困难：全档概率已下调</div>';
    h += hand.options.map((opt, i) => {
      const prob = effectiveProb(opt, hand, run);
      return '<div class="opt" data-opt="' + i + '"><div class="r1"><span class="name">' + tierOf(opt.tier).label + " · " + esc(opt.name) + '</span>' +
        '<span class="rate ' + opt.tier + '">' + prob + '%</span></div>' +
        '<div class="eff">成功 优势 ' + (opt.okDelta >= 0 ? "+" : "") + opt.okDelta + " · 失败 " + (opt.failDelta >= 0 ? "+" : "") + opt.failDelta + (run.affix.mods && run.affix.mods.handDeltaScale && run.affix.mods.handDeltaScale[hand.id] ? "（暗流修正后结算）" : "") + "</div>" +
        '<div class="cond">成立条件：<b>' + esc(opt.cond) + "</b></div></div>";
    }).join("");
    h += '<button class="hookBtn" id="intelBtn" style="margin-top:14px;width:100%">情报 · 今日剩 ' + (AD_HOOKS.intel.dailyLimit - hookUsed("intel")) + ' 次</button>';
  } else {
    const e = state.lastEntry;
    h += '<div class="resultBox' + (e.success ? "" : " fail") + '"><div class="rh">' + (e.success ? "这一手，成了" : "这一手，没成") +
      ' <span class="' + (e.delta >= 0 ? "dpos" : "dneg") + '">优势 ' + (e.delta >= 0 ? "+" : "") + e.delta + " → " + e.advAfter + "</span></div>" +
      '<div class="rt">' + esc(e.text) + (e.affixNote ? '<br><span style="color:#b23a26">' + esc(e.affixNote) + "</span>" : "") + "</div></div>" +
      '<button class="btn red" id="nextBtn">' + (run.finished ? "看 结 算" : "下 一 手") + "</button>";
  }
  app.innerHTML = h;
  if (state.phase === "pick") {
    document.querySelectorAll(".opt").forEach(el => el.addEventListener("click", () => {
      const entry = choose(ep, run, parseInt(el.dataset.opt, 10), Math.random);
      state.lastEntry = entry; state.phase = "result"; renderHand(ep, run);
    }));
    const ib = document.getElementById("intelBtn");
    if (ib) {
      trk("exposure", "出手页-情报入口", { ep: ep.id });
      ib.addEventListener("click", () => {
        if (!canUseHook("intel")) { toast("今日情报次数已用完"); return; }
        trk("click", "出手页-情报入口", { ep: ep.id });
        PlatformAdapter.showRewardAd("intel", res => {
          if (!res || !res.ok) { toast((res && res.message) || "广告未完成，情报未发放"); return; }
          consumeHook("intel"); toast("已领取情报：本局每手概率均为精确值，出手前看清成立条件");
        });
      });
    }
  } else {
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.phase = "pick"; state.lastEntry = null;
      if (run.finished) renderSettlement(ep, run); else renderHand(ep, run);
    });
  }
  window.scrollTo(0, 0);
}
/* ================= 屏幕：结算 ================= */
function commitSettle(ep, run, j) {
  if (state.settle && state.settle.archived) return;
  applyResultToRecords(store, ep, run, j, todayStr());
  /* 续命局由适配器内部按红线拦截（rewound 直接不调用云端，裁决 C-5），此处照常传全 meta 供云端复核 */
  PlatformAdapter.submitScore(computeScore(j, run.mode),
    { epId: ep.id, mode: run.mode, adv: j.adv, tier: j.tier, rewound: run.rewound }, () => {});
  saveStore();
  PlatformAdapter.cloudSaveMirror();
  if (state.settle) state.settle.archived = true;
}
function renderSettlement(ep, run) {
  state.screen = "settle";
  const j = judge(ep, run);
  /* 先在副本上预览落账结果（首改印/新档案/得分），真正落账在离开结算时提交一次 */
  const previewStore = JSON.parse(JSON.stringify(store));
  const pv = applyResultToRecords(previewStore, ep, run, j, todayStr());
  state.settle = { j: j, pv: pv, archived: false };
  const rw = rewriteSummary(ep, run, j);

    '<div class="seal' + (j.tier === "success" ? "" : " grey") + '">' + sealText + "</div>" +
    (pv.firstRewrite ? '<div class="seal small">今日<br>首改</div>' : "") +
    "</div>" +
    '<div class="cols"><div class="col"><div class="ch">真 实 历 史</div><div class="big">' + esc(ep.realHistory.ending) + '</div><div class="sm">' + esc(ep.realHistory.turning) + '</div><div class="sm">' + esc(ep.realHistory.hero) + "</div></div>" +
    '<div class="col mine"><div class="ch">我 的 改 写</div><div class="big">' + esc(rw.ending) + '</div><div class="sm">' + esc(rw.turning) + '</div><div class="sm">' + esc(rw.hero) + "</div></div></div></div>";
  h += '<div class="signLine">改命评级 <b>' + j.rating + "</b> · 最终优势 <b>" + j.adv + "</b> · 本局改命分 <b>+" + pv.gained + "</b>" +
    (pv.rankAfter !== pv.rankBefore ? ' · 段位晋升：<b>' + pv.rankAfter + "</b>" : "") + "<br>改命者 <b>" + esc(store.nickname) + "</b>" +
    (run.rewound ? ' · <span style="color:#b23a26;font-weight:700">续命完成（不计最佳评级）</span>' : "") +
    (pv.archiveNew ? '<br><span style="color:#b23a26">结局档案册新页：「' + ({ success: "改命成功", honor: "虽败犹荣", history: "历史照旧" })[pv.archiveNew] + "」已存档</span>" : "") + "</div>";
  h += "</div>"; /* /posterWrap */
  /* 逐手归因 */
  h += '<h2 class="sec">逐 手 归 因</h2><div class="logList">' +
    lines.map(l => '<div class="logItem' + (l.isAffix ? "" : "") + '"><div class="lh">' + esc(l.head) + '</div>' + esc(l.body) + "</div>").join("") + "</div>";
  /* 赛后宣言 */
  h += '<h2 class="sec">赛 后 宣 言</h2><div class="pickRow">' +
    Object.keys(ep.declarations).map(k => {
      const d = ep.declarations[k];

    }).join("") + "</div>";
  /* 下期投票 */
  h += '<h2 class="sec">下 一 期 · 你 来 定</h2><div class="pickRow">' +
    VOTE_OPTIONS.map(v => '<div class="pick' + (store.votes && store.votes.choice === v.id ? " sel" : "") + '" data-vote="' + v.id + '">' + esc(v.text) + "</div>").join("") +
    '</div><div class="foot" id="voteLine" style="margin-top:8px">投票记在本地档案，结果将在评价区公布，下期案卷按票数开卷。</div>';
  /* 广告钩子行 */
  h += '<div class="hookRow">' +
    '<button class="hookBtn" id="posterBtn">精装海报 · 今日剩 ' + (AD_HOOKS.posterDeluxe.dailyLimit - hookUsed("posterDeluxe")) + " 次</button>" +
    (j.tier !== "success" && !run.rewound ? '<button class="hookBtn" id="rewindBtn">续命一手 · 重打第五手（今日剩 ' + (AD_HOOKS.rewindLastHand.dailyLimit - hookUsed("rewindLastHand")) + " 次）</button>" : "") +
    "</div>";
  h += '<div id="statsLine" class="foot"></div>';
  h += '<button class="btn ghost" id="shareBtn">把 这 一 卷 发 到 虎 扑</button>';
  h += '<button class="btn red" id="againBtn">再 改 一 局</button><button class="btn ghost" id="homeBtn">归 档 · 回 案 卷 列 表</button>';
  h += '<div class="foot">本作是模拟归因，不是真实预测。' + esc(ep.realHistory.footnote) + "</div>";

  if (!state.settleExposed) {
    state.settleExposed = true;
    trk("exposure", "结算页-宣言选择", { ep: ep.id, result: j.tier });
  }
  PlatformAdapter.getEpisodeStats(ep.id, stats => {
    const el = document.getElementById("statsLine");
    if (!el) return;
    if (!stats) { el.textContent = "全站改命数据 · 统计中"; return; }
    /* 显示诚信（补遗 F11）：本期参与 <50 人只显示人数与成功率，不显示百分位 */
    if (stats.participants >= 50 && stats.percentile != null) {
      el.textContent = "全站本期改命成功率 " + stats.rate + "% · 你超过了 " + stats.percentile + "% 的人";
    } else {
      el.textContent = "全站本期已有 " + stats.participants + " 人改命 · 成功率 " + stats.rate + "%";
    }
  });
  PlatformAdapter.getVoteResult(vres => {
    const el = document.getElementById("voteLine");
    if (el && vres) {
      el.textContent = "全站票数：" + VOTE_OPTIONS.map(v => v.text.split("·")[0].trim() + " " + (vres[v.id] || 0) + " 票").join(" · ");
    }
  });
  document.querySelectorAll("[data-decl]").forEach(el => el.addEventListener("click", () => {
    state.declaration = el.dataset.decl;
    trk("click", "结算页-宣言选择", { ep: ep.id, result: j.tier, decl: el.dataset.decl });
    renderSettlement(ep, run);
  }));
  document.querySelectorAll("[data-vote]").forEach(el => el.addEventListener("click", () => {
    const key = el.dataset.vote;
    store.votes = { choice: key, date: todayStr() }; saveStore();
    PlatformAdapter.submitVote(key, r => {
      if (r && r.remote && !r.ok) toast(r.message || "投票失败，请稍后再试");

    });

  const pb = document.getElementById("posterBtn");
  if (pb) pb.addEventListener("click", () => {
    if (!canUseHook("posterDeluxe")) { toast("今日精装次数已用完"); return; }
    PlatformAdapter.showRewardAd("posterDeluxe", res => {
      if (!res || !res.ok) { toast((res && res.message) || "广告未完成，海报未发放"); return; }
      consumeHook("posterDeluxe"); state.deluxe = !state.deluxe; renderSettlement(ep, run);
      toast(state.deluxe ? "已切换精装海报样式" : "已恢复普通样式");
    });
  });
  const rb = document.getElementById("rewindBtn");
  if (rb) rb.addEventListener("click", () => {
    if (!canUseHook("rewindLastHand")) { toast("今日续命次数已用完"); return; }
    PlatformAdapter.showRewardAd("rewindLastHand", res => {
      if (!res || !res.ok) { toast((res && res.message) || "广告未完成，续命未发放"); return; }
      consumeHook("rewindLastHand");
      rewindRun(ep, run);
      state.settle = null; state.phase = "pick"; state.lastEntry = null;
      toast("续命一手：重打第五手。本局将标记「续命完成」");
      renderHand(ep, run);
    });
  });
  const sb = document.getElementById("shareBtn");
  if (sb) sb.addEventListener("click", () => {
    sb.disabled = true;
    PlatformAdapter.postPoster(res => {
      sb.disabled = false;
      if (res && res.ok) toast("已唤起发帖编辑器");
      else if (res && res.stage === "unavailable") toast("当前环境不支持发帖，可截图分享这一卷");
      else toast((res && res.message) || "发帖失败，请稍后再试");
    });
  });
  document.getElementById("againBtn").addEventListener("click", () => { commitSettle(ep, run, j); renderIntro(ep); });
  document.getElementById("homeBtn").addEventListener("click", () => { commitSettle(ep, run, j); renderHome(); });
  window.scrollTo(0, 0);
}
renderHome();

    const rewardTask = (st.tasks || []).filter(t => t.taskCode === "reward")[0];

  recordsProvider: null,      /* 引导接线：() => 当前 records */
  posterProvider: null,       /* 引导接线：() => 结算海报数据（无结算时 null） */
  _displayName: function () {
    try {
      const v = PlatformAdapter.displayNameProvider ? PlatformAdapter.displayNameProvider() : "";
      return (v && String(v).trim()) || "无名改命者";
    } catch (e) { return "无名改命者"; }
  },

  /* 1) 提交成绩：单局最佳分上榜；rewound 直接不调用；本地 CAPS 自检 */
  submitScore: function (score, meta, cb) {
    cb = cb || function () {};
    meta = meta || {};
    if (meta.rewound) { _log("[适配器] 续命局不上报", score, meta); cb(null); return; }
    if (meta.epId && meta.mode) {
      const cap = scoreCapFor(meta.epId, meta.mode);
      if (cap !== null && (!Number.isSafeInteger(score) || score < 0 || score > cap)) {
        _log("[适配器] 分数超本地 CAPS 自检，拒提交", score, meta);
        cb(null);
        return;
      }
    }
    if (!_cb() || !_apiBase()) { cb(null); return; } /* 无环境：本地已落账，静默降级 */
    const name = PlatformAdapter._displayName();
    const body = {
      score: score, displayName: name,
      episodeId: meta.epId, mode: meta.mode, adv: meta.adv, tier: meta.tier
    };
    _cloudReq("/api/runs", "POST", body, (data, res) => {
      if (data) { cb(data); return; }
      if (!res || res.code === 404) {
        /* 自建端点未部署（如仅模板基线）：回退模板原生提交，分数仍可上榜 */
        _cloudReq("/api/leaderboard/submit", "POST", { score: score, displayName: name },
          d2 => cb(d2 || null));
        return;
      }
      cb(null); /* 校验类失败（如 400）：不绕过云端复核 */
    });
  },

  /* 2) 我的名次：无成绩/失败均 cb(null)，UI 保留本地展示 */
  getMyRank: function (cb) {
    cb = cb || function () {};
    _cloudReq("/api/leaderboard/me", "GET", undefined, data => cb(data || null));
  },

  /* 3) 每期统计：归一化为 UI 形状 {rate, percentile, participants, myBest, totalRuns} */
  getEpisodeStats: function (epId, cb) {
    cb = cb || function () {};
    _cloudReq("/api/episode-stats?episodeId=" + encodeURIComponent(epId), "GET", undefined, data => {
      if (!data || data.successRate == null) { cb(null); return; }
      cb({
        rate: data.successRate,
        percentile: data.myPercentile != null ? data.myPercentile : null,
        participants: data.participants || 0,
        myBest: data.myBest != null ? data.myBest : null,
        totalRuns: data.totalRuns || 0
      });
    });
  },

  /* 4) 投票：平台活动未配置 → 本地降级＋打点；已配置 → 官方活动投票 */
  submitVote: function (itemKey, cb) {
    cb = cb || function () {};
    const cfg = PLATFORM_CONFIG.vote;
    const cbx = _cb();
    const items = (cfg && cfg.items) || {};
    if (!cfg || !cbx || !cbx.request || !cbx.request.activity
        || typeof cbx.request.activity.submitVote !== "function"
        || !Object.prototype.hasOwnProperty.call(items, itemKey)) {
      PlatformAdapter.track("click", "结算页-下期投票", { vote: itemKey, mode: "local" });
      cb({ ok: true, local: true, degraded: true });
      return;
    }
    _call(() => cbx.request.activity.submitVote({
      activityId: Number(cfg.activityId), groupId: Number(cfg.groupId),
      itemId: Number(items[itemKey]), voteNum: 1
    })).then(res => {
      if (res && res.code === 200 && res.data && res.data.succeed === true) cb({ ok: true, remote: true });
      else cb({ ok: false, remote: true, message: (res && res.message) || "投票失败" });
    }).catch(() => cb({ ok: false, remote: true, message: "投票失败" }));
  },

  /* 5) 投票结果：归一化为 { itemKey: 票数 }；不可用 cb(null) */
  getVoteResult: function (cb) {
    cb = cb || function () {};
    const cfg = PLATFORM_CONFIG.vote;
    const cbx = _cb();
    if (!cfg || !cbx || !cbx.request || !cbx.request.activity
        || typeof cbx.request.activity.getVoteDetail !== "function") { cb(null); return; }
    _call(() => cbx.request.activity.getVoteDetail({ activityId: String(cfg.activityId) }))
      .then(res => {
        if (!res || res.code !== 200 || !res.data) { cb(null); return; }
        const byId = {};
        for (const k in cfg.items) byId[cfg.items[k]] = k;
        const out = {};
        (function walk(groups) {
          for (const g of groups || []) {
            for (const it of g.items || []) {
              const key = byId[it.id];
              if (key) out[key] = it.voteNum == null ? 0 : it.voteNum;
            }
            if (g.subGroups) walk(g.subGroups);
          }
        })(res.data.groups);
        cb(out);
      }).catch(() => cb(null));
  },

  /* 6) 云存档镜像：节流 ≥3 秒合并；内容未变不重复写；204 后停写 */
  cloudSaveMirror: function (cb) {
    cb = cb || function () {};
    const cbx = _cb();
    if (!cbx || !cbx.cloudSave || typeof cbx.cloudSave.setValue !== "function" || _mirrorStopped) { cb(null); return; }
    let rec = null;
    try { rec = PlatformAdapter.recordsProvider ? PlatformAdapter.recordsProvider() : null; } catch (e) {}
    if (!rec) { cb(null); return; }
    const recordsJson = JSON.stringify(rec);
    if (recordsJson === _mirrorLastRecordsJson && !_mirrorPending) { cb(null); return; }
    const ts = Date.now();
    const payload = JSON.stringify({ v: 1, updatedAt: ts, records: rec });
    if (_mirrorPending) { _mirrorPending.payload = payload; _mirrorPending.ts = ts; _mirrorPending.recordsJson = recordsJson; _mirrorPending.cbs.push(cb); }
    else _mirrorPending = { payload: payload, ts: ts, recordsJson: recordsJson, cbs: [cb] };
    _scheduleMirror();
  },

  /* 7) 云存档恢复：cb(records, updatedAt)；无云档/失败 cb(null, null)，不覆盖本地 */
  cloudSaveRestore: function (cb) {
    cb = cb || function () {};
    const cbx = _cb();
    if (!cbx || !cbx.cloudSave || typeof cbx.cloudSave.getValue !== "function") { cb(null, null); return; }
    _call(() => cbx.cloudSave.getValue({ key: CLOUD_SAVE_KEY })).then(res => {
      if (res && res.code === 204) _mirrorStopped = true;
      if (!res || res.code !== 200 || res.data == null) { cb(null, null); return; }
      try {
        const w = JSON.parse(res.data);
        if (w && w.records) { cb(w.records, typeof w.updatedAt === "number" ? w.updatedAt : null); return; }
      } catch (e) {}
      cb(null, null);
    }).catch(() => cb(null, null));
  },
  cloudSaveState: function () {
    const ts = parseInt(_lsGet(CLOUD_META_KEY) || "0", 10);
    return { lastTs: isNaN(ts) ? 0 : ts };
  },
  markRestored: function (ts) {
    _lsSet(CLOUD_META_KEY, String(ts));
    try {
      const rec = PlatformAdapter.recordsProvider ? PlatformAdapter.recordsProvider() : null;
      if (rec) _mirrorLastRecordsJson = JSON.stringify(rec);
    } catch (e) {}
  },

  /* 8) 广告：vatask 差量口径（见文件头注释与裁决 C-1） */
  showRewardAd: function (hookKey, cb) {
    cb = cb || function () {};
    let finished = false;
    const done = r => { if (!finished) { finished = true; cb(r); } };
    const finish = r => { if (_adInFlight === hookKey) _adInFlight = null; done(r); };
    const vt = _vatask();
    if (!vt || typeof vt.completeRewardVideo !== "function") {
      done({ ok: true, stub: true }); /* 无平台环境：保持预览可玩（原桩行为） */
      return;
    }
    if (_adInFlight) { done({ ok: false, busy: true, message: "广告进行中，请稍候" }); return; }
    /* 后台队列迟到落定的 credit：免看直接发权益 */
    const credits = _readJson(AD_CREDIT_KEY, {});
    if (credits[hookKey]) {
      delete credits[hookKey];
      _writeJson(AD_CREDIT_KEY, credits);
      _grantHook(hookKey, g => { g.settled = "credit"; done(g); }, "credit");
      return;
    }
    const pendAll = _readJson(AD_PENDING_KEY, {});
    const p = pendAll[hookKey];
    if (p) { /* 先核对上一支未落定 */
      _adInFlight = hookKey;
      _taskState().then(st => {
        if (st && st.availableChanceCount > Math.max(p.base, _adFloor())) {
          delete pendAll[hookKey];
          _writeJson(AD_PENDING_KEY, pendAll);
          _setAdFloor(st.availableChanceCount);
          _grantHook(hookKey, g => { g.settled = "late"; finish(g); }, "settle");
          return;
        }
        _adInFlight = null;
        if (!st) { done({ ok: false, pending: true, message: "奖励核对中，请稍后再试" }); return; }
        p.checks = (p.checks || 0) + 1;
        if (Date.now() - p.at <= AD_BLOCK_MS && p.checks <= AD_MAX_CHECKS) {
          _writeJson(AD_PENDING_KEY, pendAll);
          done({ ok: false, pending: true, message: "上一支广告奖励核对中，请稍候" });
          return;
        }
        /* 超时/超次数：放行，转后台队列续核，本次继续走新流程 */
        delete pendAll[hookKey];
        _writeJson(AD_PENDING_KEY, pendAll);
        const q = _readJson(AD_QUEUE_KEY, {});
        q[hookKey] = { base: p.base, at: p.at };
        _writeJson(AD_QUEUE_KEY, q);
        _adInFlight = hookKey;
        _freshAdFlow(hookKey, finish);
      });
      return;
    }
    _adInFlight = hookKey;
    _freshAdFlow(hookKey, finish);
  },
  /* 后台队列核对（启动时调用）：PENDING/队列中已落定的转 credit，不直接发权益 */
  settleAdQueue: function (cb) {
    cb = cb || function () {};
    if (!_vatask()) { cb({ settled: [] }); return; }
    const pendAll = _readJson(AD_PENDING_KEY, {});
    const queue = _readJson(AD_QUEUE_KEY, {});
    const keys = Object.keys(pendAll).concat(Object.keys(queue).filter(k => !(k in pendAll)));
    if (!keys.length) { cb({ settled: [] }); return; }
    _taskState().then(st => {
      if (!st) { cb({ settled: [] }); return; }
      const now = st.availableChanceCount;
      const settled = [];
      for (const k of keys) {
        const rec = pendAll[k] || queue[k];
        if (rec && now > Math.max(rec.base, _adFloor())) {
          const credits = _readJson(AD_CREDIT_KEY, {});
          credits[k] = true;
          _writeJson(AD_CREDIT_KEY, credits);
          delete pendAll[k];
          delete queue[k];
          settled.push(k);
          _setAdFloor(now);
        }
      }
      _writeJson(AD_PENDING_KEY, pendAll);
      _writeJson(AD_QUEUE_KEY, queue);
      cb({ settled: settled });
    });
  },
  getHookState: function (cb) {
    cb = cb || function () {};
    _hooksState(data => cb(data || null));
  },

  /* 9) 海报发帖：Canvas → OSS → 编辑器（技能原文状态机，防连点） */
  postPoster: function (cb) {
    cb = cb || function () {};
    if (PlatformAdapter._posterBusy) { cb({ ok: false, stage: "busy", message: "海报生成中" }); return; }
    let data = null;
    try { data = PlatformAdapter.posterProvider ? PlatformAdapter.posterProvider() : null; } catch (e) {}
    if (!data) { cb({ ok: false, stage: "nodata", message: "暂无可分享的结算" }); return; }
    const cbx = _cb();
    if (!cbx || !cbx.oss || typeof cbx.oss.uploadFile !== "function"
        || !cbx.request || !cbx.request.bbs || typeof cbx.request.bbs.openPostEditor !== "function"
        || typeof document === "undefined" || typeof document.createElement !== "function") {
      cb({ ok: false, stage: "unavailable", message: "当前环境不支持发帖" });
      return;
    }
    PlatformAdapter._posterBusy = true;
    const finish = r => { PlatformAdapter._posterBusy = false; cb(r); };
    let canvas = null;
    try { canvas = drawPosterCanvas(data); } catch (e) {}
    if (!canvas || typeof canvas.toBlob !== "function") {
      finish({ ok: false, stage: "render", message: "海报生成失败" });
      return;
    }
    canvas.toBlob(blob => {
      if (!blob) { finish({ ok: false, stage: "render", message: "海报生成失败" }); return; }
      _call(() => cbx.oss.uploadFile({ file: blob, filename: "yinanyi-poster-" + Date.now() + ".png" }))
        .then(up => {
          const url = up && up.downloadUrl;
          let valid = false;
          try { const u = new URL(url); valid = u.protocol === "https:" && !!u.hostname; } catch (e) {}
          if (!valid) { finish({ ok: false, stage: "upload", message: "海报上传失败" }); return; }
          const params = { title: posterTitle(data), content: posterContent(data), imageUrl: url };
          const openEditor = () => _call(() => cbx.request.bbs.openPostEditor(params)).then(r => {
            if (r && r.code === 200) finish({ ok: true, imageUrl: url });
            else finish({ ok: false, stage: "open", imageUrl: url, message: (r && r.message) || "发帖编辑器打开失败" });
          }).catch(() => finish({ ok: false, stage: "open", imageUrl: url, message: "发帖编辑器打开失败" }));
          if (cbx.bbsConfig && typeof cbx.bbsConfig.get === "function") {
            _call(() => cbx.bbsConfig.get()).then(bbs => {
              if (bbs && typeof bbs.bbsTagId === "string" && bbs.bbsTagId.trim() !== "") {
                params.topicId = bbs.bbsTopicId;
                params.tagId = bbs.bbsTagId;
                params.topicName = bbs.bbsTopicName;
                params.tagName = bbs.bbsTagName;
              }
              openEditor();
            }).catch(() => openEditor());
          } else openEditor();
        })
        .catch(() => finish({ ok: false, stage: "upload", message: "海报上传失败" }));
    }, "image/png");
  },
  _posterBusy: false,

  /* 10) 用户信息：平台昵称优先（裁决 C-9 增补）；未登录/失败 cb(null) */
  getUserProfile: function (cb) {
    cb = cb || function () {};
    const cbx = _cb();
    if (!cbx || !cbx.auth || typeof cbx.auth.getUserInfo !== "function") { cb(null); return; }
    _call(() => cbx.auth.getUserInfo()).then(res => {
      if (res && res.code === 200 && res.data && res.data.islogin === 1 && res.data.nickname) {
        cb({
          nickname: res.data.nickname,
          avatar: res.data.avatar || res.data.userHeadUrl || "",
          puid: res.data.puid || null
        });
      } else cb(null);
    }).catch(() => cb(null));
  },

  /* 11) 内容安全检测（R-01）：玩家自由文本落盘前必须先过检。
     平台 SDK 或 security.checkAudit 不存在时降级放行：本地/断网模式没有可调用的
     平台风控能力，不能因此让署名功能不可用；此降级只适用于无 SDK 环境。
     SDK 已存在时，401 拦截并提示登录，500/异常/超时拦截本次保存并保留旧值。 */
  checkAudit: function (content, cb) {
    cb = cb || function () {};
    const cbx = _cb();
    if (!cbx || !cbx.security || typeof cbx.security.checkAudit !== "function") {
      cb({ ok: true, passed: true, degraded: true });
      return;
    }
    const audit = _call(() => cbx.security.checkAudit(String(content == null ? "" : content)));
    _raceTimeout(audit, 10000).then(r => {
      if (r.t || r.e) {
        cb({ ok: false, passed: false, error: true, message: "内容安全检测暂时不可用，请稍后再试" });
        return;
      }
      const res = r.v;
      if (res && res.code === 200 && res.data === true) {
        cb({ ok: true, passed: true });
      } else if (res && res.code === 200 && res.data === false) {
        cb({ ok: false, passed: false, blocked: true, code: 200, message: "这个署名未通过内容安全检测，请换一个" });
      } else if (res && res.code === 401) {
        cb({ ok: false, passed: false, loginRequired: true, code: 401, message: "请先登录后再保存署名" });
      } else {
        cb({ ok: false, passed: false, error: true, code: res && res.code,
          message: (res && res.message) || "内容安全检测暂时不可用，请稍后再试" });
      }
    });
  },

  /* 12) 打点：act 只用白名单（click/exposure/videoact），事件走 ext.custom */
  track: function (act, label, custom) {
    if (["click", "exposure", "videoact"].indexOf(act) < 0) return false;
    const cbx = _cb();
    if (!cbx || typeof cbx.track !== "function") return false;
    try {
      cbx.track({ act: act, blk: "BMC001", pos: "T1", ext: { label: label, custom: custom || {} } });
      return true;
    } catch (e) { return false; }
  }
};
// === ADAPTER END ===
</script>
<script>
"use strict";
/* 引导接线（适配器定义后执行）：提供者注入、平台昵称、云存档恢复、广告队列核对。
   全部异步且失败静默——平台不可用时游戏保持本地完整可玩。 */
(function bootPlatform() {
  PlatformAdapter.displayNameProvider = function () { return store.nickname; };
  PlatformAdapter.recordsProvider = function () { return store; };
  PlatformAdapter.posterProvider = function () {
    if (!state.ep || !state.run || !state.settle) return null;
    const ep = state.ep, run = state.run, j = state.settle.j;
    return {
      ep: ep, run: run, j: j,
      rw: rewriteSummary(ep, run, j),
      lines: settlementLines(ep, run),
      nickname: store.nickname,
      gained: state.settle.pv ? state.settle.pv.gained : computeScore(j, run.mode),
      declaration: (state.declaration && ep.declarations[state.declaration])
        ? ep.declarations[state.declaration].text : ""
    };
  };
  window.__yinanyiTrack = function (act, label, custom) {
    return PlatformAdapter.track(act, label, custom);
  };
  PlatformAdapter.getUserProfile(function (p) {
    if (p && p.nickname && store.nickname === "无名改命者") {
      store.nickname = p.nickname;
      saveStore();
      if (state.screen === "home") renderHome();
    }
  });
  PlatformAdapter.cloudSaveRestore(function (records, updatedAt) {
    if (!records || !updatedAt) return;
    if (updatedAt > PlatformAdapter.cloudSaveState().lastTs) {
      store = normalizeDaily(Object.assign(emptyRecords(), records), todayStr());
      saveStore();
      PlatformAdapter.markRestored(updatedAt);
      if (state.screen === "home") renderHome();
    }
  });
  PlatformAdapter.settleAdQueue(function () {});
})();
</script>
